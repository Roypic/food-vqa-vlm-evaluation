name: quality

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Validate curated JSON artifacts
        run: |
          python -m json.tool results/metrics.json >/dev/null
          python -m json.tool results/request_manifest.json >/dev/null
      - name: Check for private storage paths
        run: |
          python - <<'PY'
          from pathlib import Path

          forbidden = tuple("/stor" + suffix for suffix in (
              "age/homefs", "age/research", "age/scratch"
          ))
          hits = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if any(value in text for value in forbidden):
                  hits.append(str(path))
          if hits:
              raise SystemExit("Private cluster path found in: " + ", ".join(hits))
          PY

